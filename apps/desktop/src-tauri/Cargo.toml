[package]
name = "jarvis-desktop"
version = "0.1.0"
description = "JARVIS Windows 11 Desktop AI Assistant"
authors = ["jaleel"]
edition = "2021"

[lib]
name = "jarvis_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-mic-recorder = "2.0.0"
